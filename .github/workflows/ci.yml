name: Compatibility
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Swift ${{ matrix.swift }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        swift: ['6.3', '6.4']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Select SDK
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Install Swift 6.4
        if: matrix.swift == '6.4'
        uses: Aemi-Studio/aemi/.github/actions/setup-swift@afc1be3d578045b381e76f6b1712a81b39956ced # aemi afc1be3
      - run: swift --version
      - name: Resolve published dependencies
        run: swift package update
      - name: Test compatibility imports
        run: swift test
